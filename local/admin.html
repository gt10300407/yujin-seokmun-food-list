<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>유진 석문의 맛집 리스트 · 관리</title><link rel="icon" href="/assets/food-tour-logo.webp" type="image/webp"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/local/admin.css"><script type="module" src="/local/admin.js"></script></head>
<body class="admin-body"><div class="background" aria-hidden="true"><div class="glow glow-one"></div><div class="glow glow-two"></div></div><header class="admin-header glass"><span class="admin-brand">유진 석문의 맛집 리스트 <small>관리</small></span><a class="preview-link" href="/" target="_blank" rel="noopener">사이트 미리보기 ↗</a></header><main class="admin-wrap"><div class="admin-title"><div><h1>맛집 관리</h1><p>저장하면 이 컴퓨터의 사이트에 바로 반영됩니다.</p></div><button type="button" id="add-place" class="primary-button">+ 맛집 추가</button></div><section class="publish-panel" aria-label="공개 사이트 반영"><div><strong>공개 사이트 반영</strong><p>내용을 저장한 뒤 GitHub에 올리면 공유 링크에 적용됩니다. 이 컴퓨터에서만 실행할 수 있어요.</p></div><div class="publish-actions"><button type="button" id="publish-site" class="primary-button">저장하고 커밋·푸시</button><a href="https://gt10300407.github.io/yujin-seokmun-food-list/" target="_blank" rel="noopener noreferrer">공개 사이트 보기 ↗</a></div></section><p id="admin-status" class="admin-status" role="status"></p><div class="admin-layout"><aside class="admin-list glass"><h2>등록된 맛집 <span id="admin-count"></span></h2><div id="admin-places"></div></aside><section class="admin-editor glass" aria-labelledby="edit-title"><h2 id="edit-title">맛집 선택</h2><form id="edit-form" hidden><label>이름 <input id="edit-name" maxlength="70" required></label><label>주소 <input id="edit-address" maxlength="160" required></label><label>음식 종류 <input id="edit-category" list="category-options" maxlength="30" placeholder="예: 한식" required><datalist id="category-options"><option value="한식"><option value="중식"><option value="고기"><option value="면"><option value="두부"><option value="샤브"><option value="분식"></datalist></label><label>추천 메뉴 <input id="edit-menu" maxlength="100" placeholder="비워두면 공개 화면에 숨겨집니다"></label><label>한줄평 <textarea id="edit-comment" maxlength="240" rows="3" placeholder="한줄평 입력"></textarea></label><div class="photo-section"><div class="photo-head"><h3>사진</h3><label class="upload-button">+ 사진 추가<input id="photo-input" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden></label></div><p>JPG·PNG·WebP 사진을 선택하면 압축해서 저장합니다.</p><div id="photo-list" class="admin-photos"></div></div><div class="editor-actions"><button id="save-place" class="primary-button" type="submit">변경사항 저장</button><button id="delete-place" class="delete-button" type="button">맛집 삭제</button></div></form><p id="select-hint">맛집을 선택하거나 새로 추가하세요.</p></section></div></main></body>
</html>
