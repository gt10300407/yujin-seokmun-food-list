<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101722">
  <meta name="description" content="유진 석문의 맛집 리스트">
  <title>유진 석문의 맛집 리스트</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <div class="background" aria-hidden="true"><div class="glow glow-one"></div><div class="glow glow-two"></div><div class="glow glow-three"></div></div>
  <main class="shell">
    <header class="topbar glass"><span class="topbar-mark">YS</span><span class="topbar-title">맛집 리스트</span><span class="topbar-count"><b id="hero-count">10</b>곳</span></header>
    <section class="intro glass" aria-labelledby="page-title"><div class="intro-main"><h1 id="page-title">유진 석문의<br><span>맛집 리스트</span></h1></div><div class="intro-side" aria-hidden="true"><div class="intro-ring"><div class="intro-ring-inner"><span>YS</span></div></div></div></section>
    <section class="directory" aria-labelledby="list-title"><div class="directory-head"><h2 id="list-title">맛집 목록</h2><span class="total-badge" id="section-count">10곳</span></div><div class="filters" id="filters" role="group" aria-label="음식 종류"></div><p id="status" class="status" role="status">맛집을 불러오는 중...</p><div id="places" class="place-grid"></div></section>
  </main>
  <dialog id="detail" class="detail-dialog" aria-labelledby="detail-name"><button id="detail-close" class="detail-close" type="button" aria-label="닫기">×</button><div id="detail-content"></div></dialog>
  <dialog id="photo-viewer" class="photo-viewer" aria-label="사진 크게 보기"><button id="photo-close" type="button" aria-label="사진 닫기">×</button><img id="photo-full" alt=""></dialog>
</body>
</html>
