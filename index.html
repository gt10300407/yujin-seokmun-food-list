<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#524b85">
  <meta name="description" content="유진 석문의 맛집 리스트 to 소연누나">
  <title>유진 석문의 맛집 리스트 to 소연누나</title>
  <link rel="icon" href="./assets/food-tour-logo.webp" type="image/webp">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <main class="shell">
    <header class="intro" aria-labelledby="page-title"><span class="hero-count"><b id="hero-count">10</b>곳</span><h1 id="page-title">유진 석문의<br>맛집 리스트</h1><p class="recipient">to 소연누나</p><img class="hero-logo" src="./assets/food-tour-logo.webp" alt="FOOD TOUR" width="720" height="720"><div class="palette-stripe" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div></header>
    <section class="directory" aria-labelledby="list-title"><div class="directory-head"><h2 id="list-title">맛집 목록</h2><span class="total-badge" id="section-count">10곳</span></div><div class="filters" id="filters" role="group" aria-label="음식 종류"></div><p id="status" class="status" role="status">맛집을 불러오는 중...</p><div id="places" class="place-grid"></div></section>
  </main>
  <dialog id="detail" class="detail-dialog" aria-labelledby="detail-name"><button id="detail-close" class="detail-close" type="button" aria-label="닫기">×</button><div id="detail-content"></div></dialog>
  <dialog id="photo-viewer" class="photo-viewer" aria-label="사진 크게 보기"><button id="photo-close" type="button" aria-label="사진 닫기">×</button><img id="photo-full" alt=""></dialog>
</body>
</html>
